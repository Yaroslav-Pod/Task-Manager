<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Task Manager</h1>
            <div id="user-info" class="user-info">Завантаження користувача...</div>
        </header>

        <form id="task-form" class="task-form">
            <input type="text" id="task-input" placeholder="Що потрібно зробити?" autocomplete="off">
            <button type="submit" id="add-btn" disabled>Додати</button>
        </form>

        <div class="controls">
            <input type="text" id="search-input" class="search-input" placeholder="Пошук завдань...">
            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">Всі</button>
                <button type="button" class="filter-btn" data-filter="active">Активні</button>
                <button type="button" class="filter-btn" data-filter="completed">Виконані</button>
            </div>
        </div>

        <div class="stats">
            <span>Активних завдань: <strong id="active-count">0</strong></span>
        </div>

        <ul id="task-list" class="task-list"></ul>
    </div>
</body>
</html>
